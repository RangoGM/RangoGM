<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
<title id="title">Build Labs. Break Things. Document Everything.</title>
<desc id="desc">Closing motto in RangoNetwork landing type.</desc>
<style>@font-face{font-family:'Nunito';font-weight:950;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Nunito';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{text-rendering:geometricPrecision}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes lineUp{from{transform:translateY(62px)}}@keyframes grow{from{transform:scaleX(0);opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="duo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18181b"/><stop offset="1" stop-color="#0f0f12"/></linearGradient>
<linearGradient id="duoSm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1d21"/><stop offset="1" stop-color="#151518"/></linearGradient><clipPath id="fl"><rect x="0" y="40" width="1200" height="68"/></clipPath>
<linearGradient id="hline" x1="0" x2="1"><stop offset="0" stop-color="#a5f3fc" stop-opacity="0"/><stop offset=".16" stop-color="#a5f3fc" stop-opacity=".6"/><stop offset=".5" stop-color="#f2fdff"/><stop offset=".84" stop-color="#a5f3fc" stop-opacity=".6"/><stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/></linearGradient>
<filter id="hglow" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="0" y="4" width="1200" height="196" rx="24" fill="#27272a"/><rect x="0.5" y="0.5" width="1199" height="195" rx="24" fill="url(#duo)" stroke="#3f3f46"/>
<g clip-path="url(#fl)"><g style="animation:lineUp .9s 0.15s cubic-bezier(.2,.8,.2,1) both"><text x="102.17" y="94" font-family="Nunito, 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="46" font-weight="950" fill="#d4d4d8" letter-spacing="-2.3">Build Labs<tspan fill="#67e8f9">.</tspan></text></g><g style="animation:lineUp .9s 0.31s cubic-bezier(.2,.8,.2,1) both"><text x="345.25" y="94" font-family="Nunito, 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="46" font-weight="950" fill="#f4f4f5" letter-spacing="-2.3">Break Things<tspan fill="#67e8f9">.</tspan></text></g><g style="animation:lineUp .9s 0.47s cubic-bezier(.2,.8,.2,1) both"><text x="643.39" y="94" font-family="Nunito, 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="46" font-weight="950" fill="#d4d4d8" letter-spacing="-2.3">Document Everything<tspan fill="#67e8f9">.</tspan></text></g></g>
<rect x="440" y="122" width="320" height="2" rx="1" fill="url(#hline)" filter="url(#hglow)" class="fb" style="animation:grow 1.1s .7s cubic-bezier(.2,.8,.2,1) both"/>
<g style="animation:rise .7s 1s both"><text x="600" y="160" font-family="Nunito, 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="14" font-weight="700" fill="#a1a1aa" text-anchor="middle"><tspan fill="#d4d4d8">Dat Tran Gia</tspan> · Network Engineer On The DevSecOps Path · Ho Chi Minh City</text></g>
</svg>