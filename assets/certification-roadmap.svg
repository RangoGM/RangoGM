    <text x="315" y="148" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">AWS SAA</text>
    <text x="315" y="166" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.9">Cloud</text>
    <rect x="260" y="218" width="110" height="22" rx="11" fill="#f59e0b"/>
    <text x="315" y="233" text-anchor="middle" fill="#1a1a1a" font-size="11" font-weight="700" letter-spacing="1.5">LEARNING</text>
