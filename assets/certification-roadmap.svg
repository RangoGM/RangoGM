    <text x="1035" y="124" text-anchor="middle" fill="#ffffff" font-size="22">⭐</text>
    <text x="1035" y="148" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">CKS</text>
    <text x="1035" y="166" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">K8s Security</text>
