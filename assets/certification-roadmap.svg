    <rect x="240" y="95" width="150" height="92" rx="14" fill="url(#gLearn)" stroke="#f59e0b" stroke-width="2.5">
      <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="1.6s" repeatCount="indefinite"/>
