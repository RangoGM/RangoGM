<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="gDone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d3320"/>
    </linearGradient>
    <linearGradient id="gLearn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3d2410"/>
    </linearGradient>
    <linearGradient id="gPlan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1BA0D7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f2a4a"/>
    </linearGradient>
    <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bb86fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a1f5c"/>
    </linearGradient>
    <linearGradient id="gSupp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d6b86" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f2a3a"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <text x="600" y="34" text-anchor="middle" fill="#c9d1d9" font-size="22" font-weight="700" letter-spacing="3">CERTIFICATION ROADMAP</text>

  <!-- primary track line -->
  <line x1="135" y1="116" x2="1065" y2="116" stroke="#1BA0D7" stroke-width="2" stroke-dasharray="10 6" opacity="0.55" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <!-- CCNA · EARNED -->
  <g>
    <rect x="56" y="75" width="158" height="106" rx="14" fill="#2ea043" opacity="0.25" filter="url(#soft)">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="70" width="150" height="92" rx="14" fill="url(#gDone)" stroke="#2ea043" stroke-width="2"/>
    <text x="135" y="100" text-anchor="middle" fill="#ffffff" font-size="22">✅</text>
    <text x="135" y="124" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">CCNA</text>
    <text x="135" y="143" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">200-301</text>
    <rect x="80" y="170" width="110" height="22" rx="11" fill="#2ea043"/>
    <text x="135" y="185" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1.5">EARNED</text>
  </g>

  <!-- AWS SAA · LEARNING -->
  <g>
    <rect x="366" y="75" width="158" height="106" rx="14" fill="#f59e0b" opacity="0.30" filter="url(#soft)">
      <animate attributeName="opacity" values="0.18;0.58;0.18" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="370" y="70" width="150" height="92" rx="14" fill="url(#gLearn)" stroke="#f59e0b" stroke-width="2.5">
      <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="445" y="100" text-anchor="middle" fill="#ffffff" font-size="22">📖</text>
    <text x="445" y="124" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">AWS SAA</text>
    <text x="445" y="143" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.9">Cloud</text>
    <rect x="390" y="170" width="110" height="22" rx="11" fill="#f59e0b"/>
    <text x="445" y="185" text-anchor="middle" fill="#1a1a1a" font-size="11" font-weight="700" letter-spacing="1.5">LEARNING</text>
    <circle cx="508" cy="78" r="6" fill="#fbbf24">
      <animate attributeName="r" values="5;8;5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CKA · PLANNED -->
  <g>
    <rect x="680" y="70" width="150" height="92" rx="14" fill="url(#gPlan)" stroke="#1BA0D7" stroke-width="2"/>
    <text x="755" y="100" text-anchor="middle" fill="#ffffff" font-size="22">📚</text>
    <text x="755" y="124" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">CKA</text>
    <text x="755" y="143" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">Kubernetes</text>
    <rect x="700" y="170" width="110" height="22" rx="11" fill="#1BA0D7"/>
    <text x="755" y="185" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1.5">PLANNED</text>
  </g>

  <!-- CKS · NORTH STAR -->
  <g>
    <rect x="986" y="75" width="158" height="106" rx="14" fill="#bb86fc" opacity="0.25" filter="url(#soft)">
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="990" y="70" width="150" height="92" rx="14" fill="url(#gStar)" stroke="#bb86fc" stroke-width="2"/>
    <text x="1065" y="100" text-anchor="middle" fill="#ffffff" font-size="22">⭐</text>
    <text x="1065" y="124" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">CKS</text>
    <text x="1065" y="143" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">K8s Security</text>
    <rect x="995" y="170" width="140" height="22" rx="11" fill="#bb86fc"/>
    <text x="1065" y="185" text-anchor="middle" fill="#3a1f5c" font-size="11" font-weight="700" letter-spacing="1.5">NORTH STAR</text>
  </g>

  <!-- round 2 divider label -->
  <line x1="350" y1="247" x2="470" y2="247" stroke="#3d4046" stroke-width="1.5"/>
  <text x="600" y="252" text-anchor="middle" fill="#7d8590" font-size="12" font-weight="600" letter-spacing="2">ROUND 2 · SUPPLEMENTARY</text>
  <line x1="730" y1="247" x2="850" y2="247" stroke="#3d4046" stroke-width="1.5"/>

  <!-- Security+ · SUPPLEMENTARY -->
  <g>
    <rect x="370" y="278" width="150" height="80" rx="14" fill="url(#gSupp)" stroke="#3d6b86" stroke-width="2"/>
    <text x="445" y="306" text-anchor="middle" fill="#ffffff" font-size="20">📘</text>
    <text x="445" y="328" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Security+</text>
    <text x="445" y="346" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.8">CompTIA</text>
  </g>

  <!-- LPIC-1 · SUPPLEMENTARY -->
  <g>
    <rect x="680" y="278" width="150" height="80" rx="14" fill="url(#gSupp)" stroke="#3d6b86" stroke-width="2"/>
    <text x="755" y="306" text-anchor="middle" fill="#ffffff" font-size="20">📘</text>
    <text x="755" y="328" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">LPIC-1</text>
    <text x="755" y="346" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.8">Linux</text>
  </g>
</svg>
