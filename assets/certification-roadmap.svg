<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="gDone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d3320"/>
    </linearGradient>
    <linearGradient id="gLearn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3d2410"/>
    </linearGradient>
    <linearGradient id="gPlan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1BA0D7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f2a4a"/>
    </linearGradient>
    <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bb86fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a1f5c"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>
  <text x="600" y="32" text-anchor="middle" fill="#c9d1d9" font-size="22" font-weight="700" letter-spacing="3">CERTIFICATION ROADMAP</text>
