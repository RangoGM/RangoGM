    <text x="675" y="148" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">LPIC-1</text>
    <text x="675" y="166" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">Linux</text>
