      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="95" width="150" height="92" rx="14" fill="url(#gDone)" stroke="#2ea043" stroke-width="2"/>
    <text x="135" y="124" text-anchor="middle" fill="#ffffff" font-size="22">✅</text>
    <text x="135" y="148" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">CCNA</text>
    <text x="135" y="166" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">200-301</text>
    <rect x="80" y="218" width="110" height="22" rx="11" fill="#2ea043"/>
    <text x="135" y="233" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1.5">EARNED</text>
  </g>
