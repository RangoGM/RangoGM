    <text x="675" y="233" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1.5">PLANNED</text>
  </g>
  <g>
    <rect x="780" y="95" width="150" height="92" rx="14" fill="url(#gPlan)" stroke="#1BA0D7" stroke-width="2"/>
    <text x="855" y="124" text-anchor="middle" fill="#ffffff" font-size="22">📚</text>
    <text x="855" y="148" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">CKA</text>
    <text x="855" y="166" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">Kubernetes</text>
    <rect x="800" y="218" width="110" height="22" rx="11" fill="#1BA0D7"/>
    <text x="855" y="233" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1.5">PLANNED</text>
